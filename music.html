<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Renderer.exe</title>

<style>
/* Estetika Windows 95 */
body {
    margin: 0;
    background: #008080;
    font-family: 'MS Sans Serif', Tahoma, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

.window {
    background: #c0c0c0;
    border-top: 2px solid #ffffff;
    border-left: 2px solid #ffffff;
    border-right: 2px solid #000000;
    border-bottom: 2px solid #000000;
    padding: 2px;
    box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    width: 400px;
    max-width: 90vw;
}

.title-bar {
    background: #000080;
    color: white;
    padding: 3px 5px;
    font-weight: bold;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.content {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    text-align: center;
}

.status-box {
    background: #ffffff;
    border: 2px inset #ffffff;
    padding: 10px;
    font-size: 12px;
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.4;
}

/* Modal Popup Save As */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 12px;
    box-sizing: border-box;
}

.modal-window {
    width: 350px;
    max-width: 92vw;
}

.modal-content {
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.input-group {
    display: flex;
    align-items: center;
    gap: 10px;
}

.input-group label {
    font-size: 12px;
    width: 80px;
    text-align: left;
}

input[type="text"], textarea {
    font-family: inherit;
    background: #ffffff;
    border: 2px inset #ffffff;
    padding: 4px;
    font-size: 12px;
    flex-grow: 1;
    min-width: 0;
    box-sizing: border-box;
}

textarea {
    width: 100%;
    resize: vertical;
    min-height: 140px;
    line-height: 1.4;
}

.button-group {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
}

button.win-btn {
    padding: 4px 15px;
    font-family: inherit;
    font-size: 12px;
    background: #c0c0c0;
    border: 2px outset #ffffff;
    cursor: pointer;
    min-width: 70px;
}

button.win-btn:active {
    border: 2px inset #ffffff;
    background: #e0e0e0;
}

#hiddenPasteArea {
    position: absolute;
    left: -9999px;
    top: -9999px;
}
.small-muted {
    font-size: 11px;
    color: #444;
    line-height: 1.4;
}
</style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <span>Audio Recipe Processor.exe</span>
    </div>
    <div class="content">
        <img src="https://win98icons.alexmeub.com/icons/png/media_player_stream_stereo-0.png" alt="Audio Icon" style="width: 32px; height: 32px; margin: 0 auto;">
        <div class="status-box" id="statusText">
            Membuka aplikasi...
        </div>
    </div>
</div>

<!-- Modal Save As -->
<div class="modal-overlay" id="saveModal">
    <div class="window modal-window">
        <div class="title-bar">
            <span>Save Audio As...</span>
            <span style="cursor: pointer; background: #c0c0c0; color: black; border: 1px outset #fff; padding: 0 2px;" onclick="closeSaveModal()">X</span>
        </div>
        <div class="modal-content">
            <div style="font-size: 12px; margin-bottom: 5px;">Penyusunan file selesai. Simpan sebagai:</div>

            <div class="input-group">
                <label>File name:</label>
                <input type="text" id="fileNameInput" value="My_Sequence.wav">
            </div>

            <div class="button-group">
                <button class="win-btn" onclick="executeDownload()">Save</button>
                <button class="win-btn" onclick="closeSaveModal()">Cancel</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Fallback Input -->
<div class="modal-overlay" id="inputModal">
    <div class="window modal-window">
        <div class="title-bar">
            <span>Cook The Code</span>
            <span style="cursor: pointer; background: #c0c0c0; color: black; border: 1px outset #fff; padding: 0 2px;" onclick="closeInputModal()">X</span>
        </div>
        <div class="modal-content">
            <div style="font-size: 12px; margin-bottom: 2px;">
                Clipboard tidak bisa dibaca otomatis. Tempel JSON resep di bawah, lalu tekan <b>cook the code</b>.
            </div>
            <textarea id="manualJsonInput" placeholder='{"Name":"My_Sequence.wav","bpm":120,...}' spellcheck="false"></textarea>
            <div class="button-group">
                <button class="win-btn" onclick="cookTheCode()">cook the code</button>
                <button class="win-btn" onclick="closeInputModal()">cancel</button>
            </div>
        </div>
    </div>
</div>

<textarea id="hiddenPasteArea"></textarea>

<script>
// --- KONFIGURASI FREKUENSI NADA ---
const notesFreq = [
    293.66, 261.63, 233.08, 207.65, 196.00, 174.61, 155.56, 146.83, 130.81
];

const statusText = document.getElementById("statusText");
const saveModal = document.getElementById("saveModal");
const inputModal = document.getElementById("inputModal");
const manualJsonInput = document.getElementById("manualJsonInput");

let currentAudioUrl = null;
let hasProcessedClipboard = false;
let autoReadAttempted = false;
let currentDefaultFileName = "My_Sequence.wav";
let currentRecipeName = "My_Sequence.wav";

// --- LISTENER PASTE GLOBAL ---
// Jika user paste langsung saat modal fallback terbuka, biarkan textarea menerima paste normal.
// Di tempat lain, tangkap lalu proses.
window.addEventListener("paste", (e) => {
    if (inputModal.classList.contains("show") && e.target === manualJsonInput) {
        return;
    }

    e.preventDefault();
    const pasteData = (e.clipboardData || window.clipboardData).getData("text");
    processClipboardText(pasteData);
});

// --- AUTO BACA CLIPBOARD SAAT APLIKASI DIBUKA ---
window.addEventListener("DOMContentLoaded", () => {
    setTimeout(() => {
        tryAutoReadClipboard();
    }, 150);
});

// Kadang browser baru kasih akses setelah halaman aktif/fokus
window.addEventListener("focus", () => {
    if (!hasProcessedClipboard && !autoReadAttempted) {
        setTimeout(() => {
            tryAutoReadClipboard();
        }, 200);
    }
});

function showModal(modalEl) {
    modalEl.classList.add("show");
    modalEl.style.display = "flex";
}

function hideModal(modalEl) {
    modalEl.classList.remove("show");
    modalEl.style.display = "none";
}

function ensureWavExtension(name) {
    let fileName = (name || "").trim() || "My_Sequence.wav";
    if (!/\.wav$/i.test(fileName)) {
        fileName += ".wav";
    }
    return fileName;
}

function sanitizeFileBaseName(name) {
    return (name || "My_Sequence")
        .toString()
        .trim()
        .replace(/[<>:"/\\|?*\u0000-\u001F]/g, "_")
        .replace(/\s+/g, "_")
        .slice(0, 80) || "My_Sequence";
}

async function tryAutoReadClipboard() {
    if (hasProcessedClipboard || autoReadAttempted) return;
    autoReadAttempted = true;

    if (!navigator.clipboard || !navigator.clipboard.readText) {
        statusText.innerHTML = "Clipboard otomatis tidak didukung. Tempel resep di popup.";
        openInputModal();
        return;
    }

    try {
        statusText.innerHTML = "Membaca clipboard otomatis...";
        const text = await navigator.clipboard.readText();

        if (typeof text === "string" && text.trim()) {
            processClipboardText(text.trim());
        } else {
            statusText.innerHTML = "Clipboard kosong. Tempel resep di popup.";
            openInputModal();
        }
    } catch (err) {
        console.error("Auto clipboard read failed:", err);
        statusText.innerHTML = "Akses clipboard ditolak browser. Tempel resep di popup.";
        openInputModal();
    }
}

function processClipboardText(pasteData) {
    if (hasProcessedClipboard) return;
    hasProcessedClipboard = true;
    closeInputModal();
    processData(pasteData);
}

function openInputModal(prefillText = "") {
    manualJsonInput.value = prefillText || manualJsonInput.value || "";
    showModal(inputModal);
    setTimeout(() => manualJsonInput.focus(), 0);
}

function closeInputModal() {
    hideModal(inputModal);
}

function openSaveModal(defaultName = currentDefaultFileName) {
    const input = document.getElementById("fileNameInput");
    input.value = ensureWavExtension(defaultName);
    showModal(saveModal);
    setTimeout(() => input.focus(), 0);
}

function closeSaveModal() {
    hideModal(saveModal);
    statusText.innerHTML = "Menunggu resep baru. Tekan <b>Ctrl + V</b> kapan saja...";
}

// --- PROSES JSON KE AUDIO ---
async function processData(data) {
    try {
        const recipe = JSON.parse(data);

        // Validasi dasar struktur JSON
        if (
            recipe === null ||
            typeof recipe !== "object" ||
            typeof recipe.bpm !== "number" ||
            !Array.isArray(recipe.grid) ||
            typeof recipe.cols !== "number"
        ) {
            throw new Error("Format JSON tidak dikenali.");
        }

        if (!Array.isArray(recipe.grid) || recipe.grid.length < 9) {
            throw new Error("Grid tidak valid.");
        }

        currentRecipeName = typeof recipe.Name === "string" && recipe.Name.trim()
            ? recipe.Name.trim()
            : "My_Sequence.wav";

        currentDefaultFileName = ensureWavExtension(currentRecipeName);

        statusText.innerHTML = "Membaca resep...<br>Mengolah audio...";

        // Jeda sebentar agar UI sempat update
        setTimeout(() => {
            renderOfflineAudio(recipe).catch(err => {
                console.error(err);
                statusText.innerHTML = `<span style="color:red">Gagal merender audio.</span>`;
                hasProcessedClipboard = false;
            });
        }, 100);

    } catch (err) {
        statusText.innerHTML = `<span style="color:red">Error: Data di clipboard bukan resep musik yang valid.</span>`;
        console.error("Paste Error:", err);
        hasProcessedClipboard = false;
        openInputModal();
    }
}

// --- ENGINE RENDER AUDIO ---
async function renderOfflineAudio(recipe) {
    const bpm = recipe.bpm;
    const speedSeconds = (60 / bpm) / 4;
    const noteLength = recipe.noteLength;
    const cols = recipe.cols;
    const grid = recipe.grid;

    const totalDuration = (cols * speedSeconds) + noteLength + 0.5;

    const OfflineAudioCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OfflineAudioCtx) {
        throw new Error("OfflineAudioContext tidak didukung browser ini.");
    }

    const offlineCtx = new OfflineAudioCtx(1, Math.ceil(44100 * totalDuration), 44100);

    let currentTime = 0;

    for (let c = 0; c < cols; c++) {
        for (let r = 0; r < 9; r++) {
            if (grid[r] && grid[r][c]) {
                const osc = offlineCtx.createOscillator();
                const gain = offlineCtx.createGain();

                osc.connect(gain);
                gain.connect(offlineCtx.destination);

                osc.type = recipe.waveform || "sine";
                osc.frequency.value = notesFreq[r];

                gain.gain.setValueAtTime(0.8, currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, currentTime + noteLength);

                osc.start(currentTime);
                osc.stop(currentTime + noteLength + 0.1);
            }
        }
        currentTime += speedSeconds;
    }

    const renderedBuffer = await offlineCtx.startRendering();

    // Konversi Buffer ke WAV
    const wavData = audioBufferToWav(renderedBuffer);
    const blob = new Blob([wavData], { type: "audio/wav" });

    if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl);
    currentAudioUrl = URL.createObjectURL(blob);

    statusText.innerHTML = "Berhasil! Siap disimpan.";
    openSaveModal(currentDefaultFileName);
}

// --- CONVERTER BUFFER KE WAV ---
function audioBufferToWav(buffer) {
    const numOfChan = buffer.numberOfChannels;
    const length = buffer.length * numOfChan * 2 + 44;
    const bufferArray = new ArrayBuffer(length);
    const view = new DataView(bufferArray);
    const channels = [];
    let sample;
    let offset = 0;
    let pos = 0;

    function setUint16(data) {
        view.setUint16(pos, data, true);
        pos += 2;
    }

    function setUint32(data) {
        view.setUint32(pos, data, true);
        pos += 4;
    }

    // RIFF header
    setUint32(0x46464952); // "RIFF"
    setUint32(length - 8);
    setUint32(0x45564157); // "WAVE"
    setUint32(0x20746d66); // "fmt "
    setUint32(16);
    setUint16(1);
    setUint16(numOfChan);
    setUint32(buffer.sampleRate);
    setUint32(buffer.sampleRate * 2 * numOfChan);
    setUint16(numOfChan * 2);
    setUint16(16);
    setUint32(0x61746164); // "data"
    setUint32(length - pos - 4);

    for (let i = 0; i < buffer.numberOfChannels; i++) {
        channels.push(buffer.getChannelData(i));
    }

    while (pos < length) {
        for (let i = 0; i < numOfChan; i++) {
            sample = Math.max(-1, Math.min(1, channels[i][offset]));
            sample = (sample < 0 ? sample * 32768 : sample * 32767) | 0;
            view.setInt16(pos, sample, true);
            pos += 2;
        }
        offset++;
    }

    return bufferArray;
}

// --- LOGIKA UI POPUP ---
function executeDownload() {
    let fileName = document.getElementById("fileNameInput").value.trim();
    fileName = ensureWavExtension(fileName);

    const a = document.createElement("a");
    a.style.display = "none";
    a.href = currentAudioUrl;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    closeSaveModal();
}

function cookTheCode() {
    const raw = manualJsonInput.value.trim();
    if (!raw) {
        statusText.innerHTML = `<span style="color:red">Textarea masih kosong.</span>`;
        return;
    }

    hasProcessedClipboard = true;
    closeInputModal();
    processData(raw);
}

// Optional: tekan Ctrl+Enter di popup fallback untuk cook the code
manualJsonInput.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        cookTheCode();
    }
});
</script>
</body>
</html>
